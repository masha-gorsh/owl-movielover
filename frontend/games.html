<!doctype html>
<html lang="ru">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="theme-color" content="#101018">
  <title>Игры — owl.movielover</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=DM+Sans:wght@400;500;600;700&family=Manrope:wght@400;500;600;700;800&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="games.css">
</head>
<body>
  <a class="back-link" href="index.html">← На главную</a>
  <main class="game-layout">
    <section class="owl-side">
      <div class="owl-bubble" id="owlSpeech">Сыграем в крестики-нолики, вась?</div>
      <img id="owlImage" class="owl-img" src="assets/sova_roz.png" alt="Сова">
    </section>

    <section class="board-side">
      <h1>Крестики-нолики</h1>
      <p class="subtitle">Ты — нолики (O), сова — крестики (X)</p>
      <div class="board" id="board" aria-label="Игровое поле"></div>
      <button class="restart-btn" id="restartBtn" type="button">Сыграть ещё, вась</button>
    </section>

    <section class="bet-side">
      <img id="burmalda" class="burmalda-img" src="assets/burmalda.png" alt="Бурмалда">
      <p class="bet-label" id="betLabel">Бурмалда — ставка на игру</p>
    </section>
  </main>
  <script src="games.js"></script>
</body>
</html>
